<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIRON</title>
  <!-- Bootstrapの綺麗なデザインを読み込む1行です -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4 text-center">
    <h1>GIRON</h1>
    <ul class="nav nav-tabs justify-content-center mt-3 mb-4">
      <li class="nav-item">
        <a class="nav-link active" aria-current="page" href="#">おすすめ</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-secondary" href="#">検索</a>
      </li>
    </ul>
   <!-- 投稿カード1: 10代におすすめ -->
    <div class="card mb-3 text-start shadow-sm border-0">
      <div class="card-body">
        <span class="badge bg-info mb-2">10代におすすめ</span>
        <h5 class="card-title fw-bold">学則について</h5>
        <p class="card-text text-muted mb-2">今の時代の学校のルール、どうあるべき？</p>
        <div class="d-flex justify-content-center gap-2">
          <span class="btn btn-outline-danger w-50 fw-bold">厳しくする</span>
          <span class="btn btn-outline-primary w-50 fw-bold">自由にする</span>
        </div>
      </div>
    </div>

    <!-- 投稿カード2: 20代におすすめ -->
    <div class="card mb-3 text-start shadow-sm border-0">
      <div class="card-body">
        <span class="badge bg-primary mb-2">20代におすすめ</span>
        <h5 class="card-title fw-bold">最初に学ぶプログラミング</h5>
        <p class="card-text text-muted mb-2">初心者が勉強を始めるならどっち？</p>
        <div class="d-flex justify-content-center gap-2">
          <span class="btn btn-outline-danger w-50 fw-bold">Python陣営</span>
          <span class="btn btn-outline-primary w-50 fw-bold">Java陣営</span>
        </div>
      </div>
    </div>

    <!-- 投稿カード3: 30代におすすめ -->
    <div class="card mb-3 text-start shadow-sm border-0">
      <div class="card-body">
        <span class="badge bg-success mb-2">30代におすすめ</span>
        <h5 class="card-title fw-bold">身近な法律やルール</h5>
        <p class="card-text text-muted mb-2">これからの社会のルールはどうしていくべき？</p>
        <div class="d-flex justify-content-center gap-2">
          <span class="btn btn-outline-danger w-50 fw-bold">規制を強化</span>
          <span class="btn btn-outline-primary w-50 fw-bold">規制を緩和</span>
        </div>
      </div>
    </div>

    <!-- 投稿カード4: 全世代 -->
    <div class="card mb-3 text-start shadow-sm border-0 mb-5">
      <div class="card-body">
        <span class="badge bg-warning text-dark mb-2">全世代</span>
        <h5 class="card-title fw-bold">ペットを飼うなら？</h5>
        <p class="card-text text-muted mb-2">どちらの陣営で語り合いますか？</p>
        <div class="d-flex justify-content-center gap-2">
          <span class="btn btn-outline-danger w-50 fw-bold">犬派</span>
          <span class="btn btn-outline-primary w-50 fw-bold">猫派</span>
        </div>
      </div>
    </div>
    
    <!-- 右下の丸い投稿ボタン -->
    <a href="post.html" class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; font-size: 24px; color: white; text-decoration: none;">＋</a>
  </div>
  <!-- 画面下部のメニュー -->
    <nav class="navbar fixed-bottom bg-white border-top pb-3 pt-2">
      <div class="container-fluid justify-content-around">
        <a href="index.html" class="text-decoration-none text-primary fw-bold">ホーム</a>
        <a href="notification.html" class="text-decoration-none text-secondary">通知</a>
        <a href="profile.html" class="text-decoration-none text-secondary">プロフ</a>
      </div>
    </nav>
</body>
</html>
